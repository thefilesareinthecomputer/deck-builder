name: ci

on:
  push:
    branches: [main]  # other branches run through their pull request, so each job runs once
    paths-ignore: [README.md, "docs/images/**"]  # README-only changes don't need the test run
  pull_request:
    paths-ignore: [README.md, "docs/images/**"]
  workflow_dispatch:
  schedule:
    # Weekly, Monday 13:00 UTC: catches newly published CVEs and LibreOffice or poppler changes
    # even when nobody pushed.
    - cron: "0 13 * * 1"

permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment names the tag); Dependabot keeps them current.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - run: uv sync --locked
      - name: Unit, determinism and round-trip tests, plus static rules
        run: uv run pytest -m "not render and not office"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: Known vulnerabilities in the locked dependencies
        # The export is already the full pinned list, so pip-audit checks it as-is (--no-deps)
        # without installing or resolving anything (--disable-pip).
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt
          uvx pip-audit==2.10.1 --requirement requirements.txt --disable-pip --no-deps

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
      - name: LibreOffice (Impress renders decks, Calc re-saves workbooks), poppler and metric-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress libreoffice-calc poppler-utils fonts-liberation
      - run: uv sync --locked
      - name: Render tier (build, render, measure, re-save round trip)
        run: uv run pytest -m render
