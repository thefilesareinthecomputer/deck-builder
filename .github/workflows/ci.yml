name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run mypy

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Unit, golden and round-trip tests, plus static rules
        run: uv run pytest -m "not render and not office"

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Known vulnerabilities in the locked dependencies
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.txt
          uvx pip-audit --requirement requirements.txt --disable-pip --no-deps

  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: LibreOffice, poppler and metric-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-impress poppler-utils fonts-liberation
      - run: uv sync --locked
      - name: Render tier (build, render, measure, re-save round trip)
        run: uv run pytest -m render
