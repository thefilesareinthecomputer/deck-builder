[project]
name = "deck-builder"
version = "0.1.0"
description = "Deterministic, template-driven builder for editable PowerPoint decks from markdown or spreadsheets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["powerpoint", "pptx", "presentations", "slides", "markdown", "excel", "templates", "branding", "mcp", "claude-code"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Presentation",
    "Topic :: Office/Business :: Office Suites",
]
dependencies = [
    "python-pptx>=1.0.2,<1.1",
    "pyyaml>=6.0,<7",
    "openpyxl>=3.1.5,<3.2",
    "defusedxml>=0.7,<0.8",
    "jsonschema>=4.23,<5",
    "pillow>=11.0,<13",
]

[project.scripts]
deck-builder = "deck_builder.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deck_builder"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "render: needs LibreOffice or PowerPoint, and poppler",
    "office: needs Microsoft PowerPoint for Mac; run by hand before a release",
]
addopts = "-m 'not office'"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
files = ["src"]
ignore_missing_imports = true
